<div class="command-palette" id="commandPalette" hidden>
  <div class="command-palette-backdrop" data-palette-close></div>
  <div class="command-palette-panel" role="dialog" aria-modal="true" aria-label="게시물 검색">
    <div class="command-palette-inputwrap">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input
        id="paletteInput"
        class="command-palette-input"
        type="text"
        role="combobox"
        aria-expanded="true"
        aria-controls="paletteResults"
        aria-autocomplete="list"
        placeholder="게시물 검색..."
        autocomplete="off"
      >
      <kbd class="command-palette-esc">esc</kbd>
    </div>
    <ul class="command-palette-results" id="paletteResults" role="listbox" aria-label="검색 결과"></ul>
    <div class="command-palette-footer">↑↓ 이동 · Enter 열기 · Esc 닫기</div>
  </div>
</div>

<script id="search-data" type="application/json">
[
{% for post in site.posts %}
  {
    "title": {{ post.title | jsonify }},
    "url": {{ post.url | relative_url | jsonify }},
    "date": "{{ post.date | date: '%Y. %m. %d.' }}",
    "category": {{ post.categories | jsonify | default: '[]' }},
    "tags": {{ post.tags | jsonify | default: '[]' }},
    "description": {{ post.description | jsonify | default: '""' }}
  }{% unless forloop.last %},{% endunless %}
{% endfor %}
]
</script>

<script>
(function() {
  var palette = document.getElementById('commandPalette');
  var trigger = document.getElementById('searchTrigger');
  var input = document.getElementById('paletteInput');
  var resultsEl = document.getElementById('paletteResults');
  if (!palette || !trigger || !input || !resultsEl) {
    return;
  }

  var posts = [];
  var activeIndex = -1;
  var visibleItems = [];

  function loadPosts() {
    if (posts.length) {
      return posts;
    }
    try {
      posts = JSON.parse(document.getElementById('search-data').textContent);
    } catch (e) {
      posts = [];
    }
    return posts;
  }

  function matches(post, query) {
    var haystack = [
      post.title,
      post.description || '',
      (post.category || []).join(' '),
      (post.tags || []).join(' ')
    ].join(' ').toLowerCase();
    return haystack.indexOf(query) !== -1;
  }

  function render(query) {
    var data = loadPosts();
    var q = query.trim().toLowerCase();
    var results = data.filter(function(post) {
      return !q || matches(post, q);
    });

    resultsEl.innerHTML = '';
    visibleItems = [];
    activeIndex = -1;

    if (!results.length) {
      var empty = document.createElement('li');
      empty.className = 'command-palette-empty';
      empty.textContent = q ? '일치하는 게시물이 없습니다.' : '게시물이 없습니다.';
      resultsEl.appendChild(empty);
      return;
    }

    results.forEach(function(post) {
      var li = document.createElement('li');
      li.className = 'command-palette-item';
      li.setAttribute('role', 'option');
      li.id = 'palette-item-' + visibleItems.length;

      var link = document.createElement('a');
      link.href = post.url;
      var title = document.createElement('span');
      title.className = 'command-palette-title';
      title.textContent = post.title;
      var meta = document.createElement('span');
      meta.className = 'command-palette-meta';
      var category = (post.category && post.category[0]) || '';
      meta.textContent = [post.date, category].filter(Boolean).join(' · ');
      link.appendChild(title);
      link.appendChild(meta);
      li.appendChild(link);
      resultsEl.appendChild(li);
      visibleItems.push(li);
    });

    setActive(0);
  }

  function setActive(index) {
    if (!visibleItems.length) {
      return;
    }
    if (activeIndex >= 0 && visibleItems[activeIndex]) {
      visibleItems[activeIndex].classList.remove('is-active');
    }
    activeIndex = index;
    var item = visibleItems[activeIndex];
    item.classList.add('is-active');
    input.setAttribute('aria-activedescendant', item.id);
    item.scrollIntoView({ block: 'nearest' });
  }

  function open() {
    palette.hidden = false;
    document.body.style.overflow = 'hidden';
    input.value = '';
    render('');
    input.focus();
  }

  function close() {
    palette.hidden = true;
    document.body.style.overflow = '';
  }

  trigger.addEventListener('click', open);

  palette.addEventListener('click', function(e) {
    if (e.target.closest('[data-palette-close]')) {
      close();
    }
  });

  input.addEventListener('input', function() {
    render(input.value);
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActive((activeIndex + 1) % visibleItems.length);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActive((activeIndex - 1 + visibleItems.length) % visibleItems.length);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      var item = visibleItems[activeIndex];
      if (item) {
        var link = item.querySelector('a');
        if (link) {
          window.location.href = link.href;
        }
      }
    }
  });

  document.addEventListener('keydown', function(e) {
    var isPaletteOpen = !palette.hidden;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (isPaletteOpen) {
        close();
      } else {
        open();
      }
    } else if (e.key === 'Escape' && isPaletteOpen) {
      close();
    }
  });
})();
</script>
